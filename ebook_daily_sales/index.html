  --ly:#6B7483;--cost1:#E39A4E;--cost2:#A58CE8;
  --good:#4CC27E;--good-soft:#16301F;--bad:#F07268;--bad-soft:#3A1C1A;--warn:#E6B04F;--warn-soft:#352812;--grid:#222834;
}}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;margin:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const DAYS=30,EL=21;
const WK=['일','월','화','수','목','금','토'];
const wd=d=>new Date(2026,8,d).getDay();
const isWE=d=>{const w=wd(d);return w===0||w===6};
const $=s=>document.querySelector(s);
const won=v=>v==null?'–':Math.round(v).toLocaleString('ko-KR');
const eok=v=>(v/1e8).toFixed(2)+'억';
const man=v=>Math.abs(v)>=1e8?eok(v):Math.round(v/1e4).toLocaleString('ko-KR')+'만';
const pct=(v,d=1)=>v==null||!isFinite(v)?'–':(v>0?'+':'')+v.toFixed(d)+'%';
const cls=v=>v==null?'':v>=0?'up':'dn';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 대분류 ---------- */
const BIZ={
  book:{name:'도서',sample:true,data:window.SAMPLE_DATA.book,segs:[['total','종합']]},
  ebook:{name:'eBook',sample:false,data:window.EBOOK_DATA,segs:[['total','종합'],['general','일반'],['genre','장르'],['comic','만화']],
    pdKey:{'이민정/곽수진':['이민정','곽수진']},prodPd:{'이민정/곽수진':'이민정,곽수진'},
    extraCats:[{name:'eBook사은품',s:97600,yoy:null,share:0,unit:null,cnt:null,extra:true}],
    source:'원본: 「eBook 일별 매출 및 비용보고_2026-09-22.pdf」 18쪽에서 추출한 실데이터입니다.'},
  foreign:{name:'외서',sample:true,data:window.SAMPLE_DATA.foreign,segs:[['total','종합']]},
};
const BIZ_ORDER=['book','ebook','foreign'];
let D,B,TARGET,segRows,promoAll,cats,SEGN;
const pdKeys=pd=>(B.pdKey&&B.pdKey[pd])||[pd];
const prodPd=pd=>(B.prodPd&&B.prodPd[pd])||pd;
function pdCost(pd){
  const ks=pdKeys(pd);let cp=0,gv=0;
  for(const g in D.coupon)for(const x of D.coupon[g].byPd)if(ks.includes(x.pd))cp+=x.amt;
  for(const g in D.voucher)for(const x of D.voucher[g].byPd)if(ks.includes(x.pd))gv+=x.amt;
  return {cp,gv};
}
function catList(k){return [...BIZ[k].data.cats,...(BIZ[k].extraCats||[])]}

/* ---------- 분야별 목표 ---------- */
const TKEY='ebook-dash-targets';
let TG={};
try{TG=JSON.parse(localStorage.getItem(TKEY)||'{}')||{}}catch(e){TG={}}
const catLy=c=>c.yoy==null?c.s:c.s/(1+c.yoy/100);
const lyMonth=c=>catLy(c)/EL*DAYS;
function allocTargets(k){
  const cs=catList(k).filter(c=>!c.extra),tot=BIZ[k].data.pd.reduce((a,p)=>a+p.target,0);
  const lys=cs.map(catLy),ls=lys.reduce((a,b)=>a+b,0),out={};let acc=0;
  cs.forEach((c,i)=>{const v=i===cs.length-1?tot-acc:Math.round(tot*lys[i]/ls/1e5)*1e5;out[c.name]=v;acc+=v});
  return out;
}
const isExampleTg=k=>!TG[k];
const targetsOf=k=>TG[k]||allocTargets(k);
function verdict(fc){if(fc==null)return '<span class="chip mute">목표 없음</span>';if(fc>=100)return '<span class="chip good">달성 예상</span>';if(fc>=90)return '<span class="chip warn">근접</span>';return '<span class="chip bad">미달 예상</span>'}

/* ---------- state ---------- */
const st={biz:'ebook',tab:'ov',seg:'total',pd:'',pgrp:'',psort:'amt',pdir:-1,q:'',csort:'s',cdir:-1,ptype:'all',pq:'',fpd:''};
try{Object.assign(st,JSON.parse(localStorage.getItem('ebook-dash')||'{}'))}catch(e){}
if(!BIZ[st.biz])st.biz='ebook';
const save=()=>{try{localStorage.setItem('ebook-dash',JSON.stringify({biz:st.biz,tab:st.tab,seg:st.seg,pd:st.pd}))}catch(e){}};

function load(){
  B=BIZ[st.biz];D=B.data;
  SEGN=Object.fromEntries(B.segs);
  if(!D.seg[st.seg])st.seg='total';
  if(!D.pd.find(p=>p.pd===st.pd))st.pd=D.pd[0].pd;
  TARGET=D.pd.reduce((a,p)=>a+p.target,0);
  segRows={};
  for(const k in D.seg){
    const S=D.seg[k],have=new Set(S.rows.map(r=>r.d)),miss=[];
    for(let d=1;d<=EL;d++)if(!have.has(d))miss.push(d);
    const sumS=S.rows.reduce((a,r)=>a+r.s,0),sumC=S.rows.reduce((a,r)=>a+r.cp,0),sumG=S.rows.reduce((a,r)=>a+r.gv,0);
    const rows=S.rows.map(r=>({...r,cost:r.cp+r.gv,ly:r.yoy==null?null:r.s/(1+r.yoy/100)}));
    let derived=null;
    if(miss.length===1){const d=miss[0];derived={d,s:S.cum-sumS,cp:S.cp-sumC,gv:S.gv-sumG,yoy:null,ly:null,derived:true};derived.cost=derived.cp+derived.gv;derived.net=derived.s-derived.cost;rows.push(derived)}
    rows.sort((a,b)=>a.d-b.d);
    segRows[k]={rows,miss:miss.length>1?miss:[],missSum:miss.length>1?S.cum-sumS:0,derived};
  }
  promoAll=[];
  for(const t of ['coupon','voucher'])for(const g in D[t])for(const x of D[t][g].detail)promoAll.push({...x,type:t,grp:g});
  cats=catList(st.biz);
}

    plugins:{legend:{display:false},tooltip:{backgroundColor:css('--ink'),titleColor:css('--bg'),bodyColor:css('--bg'),padding:10,cornerRadius:6,titleFont:{family:'IBM Plex Sans KR'},bodyFont:{family:'IBM Plex Mono',size:12},boxPadding:4}},
    scales:{x:{grid:{display:false},border:{color:css('--line2')},ticks:{color:tick,font:{size:11,family:'IBM Plex Sans KR'},maxRotation:0,autoSkipPadding:8}},
            y:{beginAtZero:true,grid:{color:grid},border:{display:false},ticks:{color:tick,font:{size:11,family:'IBM Plex Mono'}}}}},extra);
}
const yM=o=>({...o.scales,y:{...o.scales.y,ticks:{...o.scales.y.ticks,callback:v=>v+'M'}}});
const dayLab=d=>d+'('+WK[wd(d)]+')';

function sortTh(cols,key,dir){return cols.map(([k,l,n])=>`<th ${k?`data-k="${k}" tabindex="0"`:''} class="${n?'n':''}" ${k===key?`aria-sort="${dir<0?'descending':'ascending'}"`:''}>${l}${k===key?` <span class="ar">${dir<0?'▼':'▲'}</span>`:''}</th>`).join('')}
function bindSort(sel,getK,getD,set){document.querySelectorAll(sel+' th[data-k]').forEach(th=>{const f=()=>{const k=th.dataset.k;set(k,getK()===k?-getD():-1);render()};th.onclick=f;th.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();f()}}})}

  ['info','분야 목표가 원본에 없음','원본은 PD(파트) 단위 목표만 있고 분야(중분류) 목표가 없습니다. 「분야별 목표 설정」에서 입력하기 전까지는 PD 목표 합계를 전년 비중으로 나눈 예시 배분을 씁니다.','PD 목표 합 2,177,999,999원'],
  ['info','YoY는 같은 날짜 비교','9/7 +26.3%, 9/15 −19.7%처럼 일별 YoY가 크게 흔들리는 것은 요일이 어긋난 영향이 섞인 것으로 보입니다. 같은 요일끼리 비교하는 옵션을 추가할 것을 권합니다.','2025-09-07은 일요일, 2026-09-07은 월요일'],
  ['info','원본 텍스트 오류','상품권 금액 1건이 "214 000"처럼 쉼표 대신 공백으로 표기되어 있고, 쿠폰 1건은 캠페인명 셀이 깨져 파싱에서 빠졌습니다.','상품권 493421 · 쿠폰 셀 조각: 민음사세 · 전 · 이방인 · 대여한정 · 할인'],
],
sample:[
  ['warn','샘플 데이터','원천 데이터가 연결되지 않아 시드 고정 난수로 만든 가상 수치를 보여줍니다. 합계 관계(일별 합 = 누적, 파트 합 = 종합, 분야 합 = 종합)만 실제 구조와 같게 맞췄습니다.','assets/data-sample.js'],
  ['info','연결 시 필요한 데이터','eBook과 같은 스키마로 일별 매출·YoY·쿠폰·상품권, 파트 목표, 분야별 누적, 상위 상품, 캠페인 사용액을 내려주면 코드 변경 없이 표시됩니다.','seg · pd · pdDaily · cats · products · coupon · voucher'],
]};
const issuesOf=()=>B.sample?ISSUES.sample:ISSUES.ebook;
function viewQa(){
  const lab={bad:'누락',warn:'확인 필요',info:'참고'},L=issuesOf();
  $('#view').innerHTML=`${sampleBanner()}<section class="panel"><div class="ph"><h2>원본 데이터 점검 · ${B.name}</h2><span class="sub">${L.length}건</span></div>
  ${L.map(([s,t,p,e])=>`<div class="issue"><div><span class="chip ${s}">${lab[s]}</span></div><div><h3>${t}</h3><p>${p}</p><span class="ev">${esc(e)}</span></div></div>`).join('')}</section>`;
}

/* ---------- 분야별 목표 레이어 ---------- */
const dlg=$('#tgtDlg');
let draft={},dirty=new Set(),dlgBiz='ebook';
const parseWon=s=>{const n=String(s).replace(/[^\d]/g,'');return n?Number(n):null};
function openTgt(k){
  draft={};dirty=new Set();
  BIZ_ORDER.forEach(b=>draft[b]={...targetsOf(b)});
  dlgBiz=k||st.biz;
  renderTgt();
  dlg.showModal();
}
function tgtRowCalc(c,t){const ach=t?c.s/t*100:null,fc=t?c.s/EL*DAYS/t*100:null;return {ach,fc}}
function tgtSummary(){
  const cs=catList(dlgBiz).filter(c=>!c.extra),t=draft[dlgBiz];
  const sum=cs.reduce((a,c)=>a+(t[c.name]||0),0),pdSum=BIZ[dlgBiz].data.pd.reduce((a,p)=>a+p.target,0);
  const filled=cs.filter(c=>t[c.name]).length,diff=sum-pdSum;
  $('#tgtSum').innerHTML=`<span>분야 목표 합 <b>${won(sum)}</b>원</span><span>PD 목표 합 <b>${won(pdSum)}</b>원</span><span>차이 <b class="${Math.abs(diff)<1e5?'':diff>0?'up':'dn'}">${diff>0?'+':''}${won(diff)}</b></span><span>입력 <b>${filled}/${cs.length}</b>개</span>${isExampleTg(dlgBiz)&&!dirty.has(dlgBiz)?'<span class="chip mute">예시 배분 상태</span>':''}`;
}
function renderTgt(){
  $('#tgtTabs').innerHTML=BIZ_ORDER.map(b=>`<button role="tab" type="button" data-b="${b}" aria-selected="${b===dlgBiz}">${BIZ[b].name}${BIZ[b].sample?' <span class="chip warn">샘플</span>':''}${dirty.has(b)?'<i class="dirty" aria-label="변경됨"></i>':''}</button>`).join('');
  const cs=[...catList(dlgBiz).filter(c=>!c.extra)].sort((a,b)=>b.s-a.s),t=draft[dlgBiz];
  $('#tgtBody').innerHTML=cs.map((c,i)=>{const v=t[c.name]||null,{ach,fc}=tgtRowCalc(c,v);return `<tr data-c="${esc(c.name)}">
    <td>${esc(c.name)}</td><td class="n" style="color:var(--ink2)">${won(lyMonth(c))}</td><td class="n">${won(c.s)}</td>
    <td class="n"><input class="tin${v?'':' empty'}" id="tgt-${dlgBiz}-${i}" inputmode="numeric" autocomplete="off" aria-label="${esc(c.name)} 월 목표(원)" value="${v?won(v):''}" placeholder="미입력"></td>
    <td class="n" data-f="ach">${ach==null?'–':ach.toFixed(0)+'%'}</td><td class="n ${fc==null?'':fc>=100?'up':'dn'}" data-f="fc">${fc==null?'–':fc.toFixed(0)+'%'}</td><td data-f="vd">${verdict(fc)}</td></tr>`}).join('');
  tgtSummary();
  document.querySelectorAll('#tgtTabs button').forEach(b=>b.onclick=()=>{dlgBiz=b.dataset.b;renderTgt()});
  document.querySelectorAll('#tgtBody input').forEach(inp=>{
    const tr=inp.closest('tr'),name=tr.dataset.c,c=cs.find(x=>x.name===name);
    inp.oninput=()=>{
      const v=parseWon(inp.value);
      draft[dlgBiz][name]=v;
      if(!dirty.has(dlgBiz)){dirty.add(dlgBiz);const tb=document.querySelector(`#tgtTabs button[data-b="${dlgBiz}"]`);if(tb&&!tb.querySelector('.dirty'))tb.insertAdjacentHTML('beforeend','<i class="dirty" aria-label="변경됨"></i>')}
      const {ach,fc}=tgtRowCalc(c,v);
      tr.querySelector('[data-f="ach"]').textContent=ach==null?'–':ach.toFixed(0)+'%';
      const fcEl=tr.querySelector('[data-f="fc"]');fcEl.textContent=fc==null?'–':fc.toFixed(0)+'%';fcEl.className='n '+(fc==null?'':fc>=100?'up':'dn');
      tr.querySelector('[data-f="vd"]').innerHTML=verdict(fc);
      inp.classList.toggle('empty',!v);
      tgtSummary();
    };
    inp.onblur=()=>{const v=parseWon(inp.value);inp.value=v?won(v):''};
    inp.onfocus=()=>inp.select();
  });
}
function bulk(fn){const cs=catList(dlgBiz).filter(c=>!c.extra);draft[dlgBiz]=fn(cs);dirty.add(dlgBiz);renderTgt()}
$('#tgtAlloc').onclick=()=>bulk(()=>allocTargets(dlgBiz));
$('#tgtGrowBtn').onclick=()=>{const g=Number($('#tgtGrow').value);if(!isFinite(g)){$('#tgtGrow').focus();return}bulk(cs=>Object.fromEntries(cs.map(c=>[c.name,Math.round(lyMonth(c)*(1+g/100)/1e5)*1e5])))};
$('#tgtClear').onclick=()=>bulk(cs=>Object.fromEntries(cs.map(c=>[c.name,null])));
const closeTgt=()=>dlg.close();
$('#tgtX').onclick=closeTgt;$('#tgtCancel').onclick=closeTgt;
dlg.addEventListener('click',e=>{if(e.target===dlg)closeTgt()});
$('#tgtSave').onclick=()=>{
  dirty.forEach(b=>{TG[b]=Object.fromEntries(Object.entries(draft[b]).filter(([,v])=>v))});
  try{localStorage.setItem(TKEY,JSON.stringify(TG))}catch(e){}
  const n=dirty.size;closeTgt();render();
  if(n)toast(`${[...dirty].map(b=>BIZ[b].name).join(', ')} 분야 목표를 저장했습니다`);
};
$('#openTgt').onclick=()=>openTgt(st.biz);
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');t.style.cssText='position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:20;max-width:calc(100% - 32px)';document.body.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}

/* ---------- shell ---------- */
const VIEWS={ov:viewOv,pd:viewPd,cat:viewCat,cost:viewCost,prod:viewProd,qa:viewQa};
function setTab(t){st.tab=t;save();render();window.scrollTo({top:0})}
function renderHeader(){
  $('#ttl').textContent=`${B.name} 일별 매출·비용`;
  $('#bizSel').innerHTML=BIZ_ORDER.map(b=>`<button type="button" data-v="${b}" aria-pressed="${b===st.biz}">${BIZ[b].name}</button>`).join('');
  document.querySelectorAll('#bizSel button').forEach(b=>b.onclick=()=>{if(st.biz===b.dataset.v)return;st.biz=b.dataset.v;st.seg='total';st.pgrp='';st.fpd='';st.q='';st.pq='';load();save();render()});
  $('#segWrap').hidden=B.segs.length<2;
  $('#segSel').innerHTML=B.segs.map(([k,n])=>`<button type="button" data-v="${k}">${n}</button>`).join('');
  document.querySelectorAll('#segSel button').forEach(b=>b.onclick=()=>{st.seg=b.dataset.v;save();render()});
  $('#qaCnt').textContent=issuesOf().filter(i=>i[0]!=='info').length;
  $('#foot').textContent=`${B.sample?`${B.name}: 원천 연결 전 샘플 데이터입니다(실제 실적 아님).`:B.source} 월말 예상은 누적 매출을 경과일로 나눈 단순 일평균 기준이고, 2025년 일별 값은 일별 YoY로 역산했습니다.`;
}
function render(){
  killCharts();
  renderHeader();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===st.tab));
  const segOn=['ov','cost'].includes(st.tab);
  document.querySelectorAll('#segSel button').forEach(b=>{b.setAttribute('aria-pressed',b.dataset.v===st.seg);b.disabled=!segOn;b.style.opacity=segOn?1:.45});
  (VIEWS[st.tab]||viewOv)();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
load();render();
</script>
