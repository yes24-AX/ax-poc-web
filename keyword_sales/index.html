  <!-- ===================== MAIN ===================== -->
  <div class="main-wrapper">

    <header class="top-header">
      <button class="btn btn-icon btn-outline btn-sm" title="사이드바 토글" aria-label="사이드바 토글">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <div class="header-separator"></div>
      <div class="header-breadcrumb">
        <span class="header-breadcrumb-group">MD 분석</span>
        <span class="header-breadcrumb-sep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        <span class="header-breadcrumb-current">키워드 판매 분석</span>
      </div>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <span class="model-pill">POC · 목업 데이터</span>
        <button class="theme-toggle" id="themeToggle" title="다크/라이트 모드 전환" aria-label="다크모드 전환">
          <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="iconSun" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <main class="page-content">

      <div class="page-heading">
        <div class="page-heading-left">
          <div>
            <h1 class="page-title">키워드 판매 분석</h1>
            <p class="page-subtitle">키워드로 검색된 상품의 기간별 판매량·매출을 확인하고, 대외 제공용 엑셀로 내려받습니다.</p>
          </div>
        </div>
      </div>

      <!-- ===== 검색 · 기간 (한 줄) ===== -->
      <div class="card ks-search-card">
        <div class="card-content ks-search-row">
          <div class="ks-field ks-field-kw">
            <label class="ks-field-label" for="q">키워드</label>
            <div class="poc-input-wrap">
              <svg class="poc-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="poc-input" id="q" type="text" value="필사" placeholder="키워드를 입력하세요" autocomplete="off" />
            </div>
          </div>

          <div class="ks-field-sep"></div>

          <div class="ks-field ks-field-period">
            <span class="ks-field-label">조회 기간</span>
            <div class="ks-period">
              <input class="ks-date" id="dFrom" type="date" aria-label="시작일" />
              <span class="ks-tilde">~</span>
              <input class="ks-date" id="dTo" type="date" aria-label="종료일" />
              <div class="ks-quick" id="quick">
                <button class="chip" data-preset="ytd">올해</button>
                <button class="chip" data-preset="1y">1년</button>
                <button class="chip" data-preset="3y">3년</button>
                <button class="chip" data-preset="10y">10년</button>
              </div>
            </div>
          </div>

          <button class="btn btn-primary ks-search-btn" id="btnSearch">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            검색
          </button>
        </div>
      </div>

      <!-- ===== 검색 실패 ===== -->
      <div class="card hidden" id="errBox">
        <div class="card-content">
          <div class="empty" style="padding:44px 20px">
            <h2 id="errMsg"></h2>
            <p id="errHint"></p>
          </div>
        </div>
      </div>

      <!-- ===== 로딩 ===== -->
      <div class="card hidden" id="skeleton">
        <div class="card-content">
          <div class="ai-thinking">
            <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
            검색 API를 호출하는 중…
          </div>
          <div class="shimmer sk" style="width:70%"></div>
          <div class="shimmer sk" style="width:92%"></div>
          <div class="shimmer sk" style="width:84%"></div>
        </div>
      </div>

      <!-- ===== 결과 ===== -->
      <div id="resultArea" class="hidden">

        <div class="ks-layout">

        <!-- ===== 상세 검색 조건 ===== -->
        <aside class="ks-filters" aria-label="상세 검색 조건">
          <div class="ks-filter-head">
            <span>상세 조건</span>
            <button class="ks-filter-reset hidden" id="btnResetFilter">초기화</button>
          </div>

          <div class="ks-filter-sec">
            <div class="ks-filter-title">결과 내 재검색</div>
            <input class="ks-refine" id="refine" type="text" placeholder="도서명·부제 검색" autocomplete="off" />
          </div>

          <div class="ks-filter-sec">
            <div class="ks-filter-title">분야</div>
            <div class="ks-facets" id="facetCats"></div>
          </div>

          <div class="ks-filter-sec">
            <div class="ks-filter-title">상품태그</div>
            <div class="ks-facets" id="facetTags"></div>
          </div>
        </aside>

        <div class="ks-main">

        <!-- 목록 -->
        <div class="card ks-result-card">
          <div class="card-header ks-result-head">
            <div>
              <div class="card-title">상품 목록 <span class="ks-count" id="resCount">0종</span></div>
              <div class="card-description" id="resDesc"></div>
            </div>
            <label class="ks-inline-field">
              <span>상품 정렬</span>
              <select class="ks-select" id="sortSel" aria-label="상품 정렬 조건">
                <optgroup label="판매 기준">
                  <option value="qty">판매량순</option>
                  <option value="amount">매출순</option>
                </optgroup>
                <optgroup label="상품 기준">
                  <option value="POPULAR">인기도순</option>
                  <option value="RELATION">정확도순</option>
                  <option value="RECENT">신상품순</option>
                  <option value="REG_DTS">등록일순</option>
                  <option value="PRICE_ASC">최저가순</option>
                  <option value="PRICE_DESC">최고가순</option>
                  <option value="SCORE">평점순</option>
                  <option value="REVIEW">리뷰순</option>
                </optgroup>
              </select>
            </label>
          </div>

          <!-- 내보내기 바 -->
          <div class="ks-export-bar">
            <label class="ks-check" for="aiJudge">
              <input type="checkbox" id="aiJudge" checked />
              <span class="ks-check-box" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </span>
              <span class="ks-check-text">
                <b>검색어 관련성 AI 판별</b>
                <em>다운로드 직전 LLM이 &ldquo;<span id="aiKw">필사</span>&rdquo;와 실제로 관련된 상품인지 판별해 무관한 상품을 파일에서 뺍니다. 해제하면 검색 결과 전건이 그대로 저장됩니다.</em>
              </span>
            </label>
            <div class="ks-export-actions">
              <button class="btn btn-primary btn-sm" id="btnXlsx">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                엑셀 다운로드
              </button>
            </div>
          </div>

          <!-- AI 판별 결과 -->
          <div class="ks-ai-result hidden" id="aiResult">
            <span class="ai-badge"><span class="dot"></span>AI 관련성 판별</span>
            <span class="ks-ai-summary" id="aiSummary"></span>
            <div class="ks-ai-actions">
              <label class="ks-switch">
                <input type="checkbox" id="hideIrrel" />
                <span class="ks-track"></span>
                <span>무관 상품 숨기기</span>
              </label>
              <span class="ks-ai-meta" id="aiMeta"></span>
            </div>
          </div>

          <div class="ks-table-wrap">
            <table class="ks-table">
              <thead>
                <tr>
                  <th class="ks-c-center ks-col-no" id="thRank">순위</th>
                  <th class="ks-col-id">상품번호</th>
                  <th class="ks-col-title">도서명 · 부제</th>
                  <th class="ks-col-tags">해시태그</th>
                  <th class="ks-col-date">출간일</th>
                  <th class="ks-c-right ks-col-price">판매가</th>
                  <th class="ks-th-sort ks-c-right ks-col-qty on" data-sort="qty">판매량<span class="arrow">↓</span></th>
                  <th class="ks-th-sort ks-c-right ks-col-amt" data-sort="amount">매출<span class="arrow">↓</span></th>
                  <th class="ks-c-center ks-col-rel hidden" id="thRel">관련성</th>
                </tr>
              </thead>
              <tbody id="tbody"></tbody>
            </table>
          </div>
          <div class="ks-pager" id="pager">
            <span class="ks-page-info" id="pageInfo"></span>
            <div class="ks-page-btns" id="pageBtns"></div>
            <label class="ks-page-size">
              <span>페이지당</span>
              <select class="ks-select" id="pageSize" aria-label="페이지당 표시 건수">
                <option value="10">10건</option>
                <option value="20" selected>20건</option>
                <option value="50">50건</option>
                <option value="100">100건</option>
              </select>
            </label>
          </div>
        </div>

        </div>
        </div>

      </div>
    </main>
  </div>
</div>

<div class="ks-toast" id="toast"></div>

<script src="assets/js/xlsx.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
