<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Loading Animations</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #f8fbff 0%, #eef4ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
    }

    .grid {
      width: min(100%, 960px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 14px;
    }

    .card {
      height: 110px;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.35; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    @keyframes wave {
      0%, 100% { transform: scaleY(0.45); opacity: 0.35; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    @keyframes floatX {
      0% { transform: translateX(-24px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(24px); opacity: 0; }
    }

    @keyframes shimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(220%); }
    }

    @keyframes scanY {
      0% { transform: translateY(-30px); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(30px); opacity: 0; }
    }

    @keyframes ringPulse {
      0% { transform: scale(1); opacity: 0.7; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.25; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* 1. AI core orbit */
    .core-orbit {
      position: relative;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #93c5fd, #2563eb 70%);
      box-shadow: 0 0 24px rgba(37, 99, 235, 0.28);
    }
    .core-orbit::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1.5px solid rgba(37, 99, 235, 0.18);
    }
    .core-orbit::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      top: -4px;
      left: 22px;
      border-radius: 50%;
      background: #7c3aed;
      box-shadow: 0 0 10px rgba(124, 58, 237, 0.45);
      transform-origin: 4px 30px;
      animation: spin 1s linear infinite;
    }

    /* 2. Token stream */
    .token-stream {
      display: flex;
      gap: 5px;
      align-items: center;
      justify-content: center;
    }
    .token-stream span {
      width: 9px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(180deg, #2563eb, #8b5cf6);
      animation: wave 0.9s ease-in-out infinite;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.14);
    }
    .token-stream span:nth-child(2) { animation-delay: 0.08s; }
    .token-stream span:nth-child(3) { animation-delay: 0.16s; }
    .token-stream span:nth-child(4) { animation-delay: 0.24s; }
    .token-stream span:nth-child(5) { animation-delay: 0.32s; }
    .token-stream span:nth-child(6) { animation-delay: 0.40s; }

    /* 3. Neural nodes */
    .neural {
      position: relative;
      width: 60px;
      height: 60px;
    }
    .neural .line {
      position: absolute;
      background: #cfe0ff;
      border-radius: 999px;
    }
    .neural .l1 { width: 34px; height: 1px; top: 16px; left: 13px; }
    .neural .l2 { width: 34px; height: 1px; top: 44px; left: 13px; }
    .neural .l3 { width: 1px; height: 28px; top: 16px; left: 30px; }
    .neural .node {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.08);
      animation: pulse 1.3s ease-in-out infinite;
    }
    .neural .n1 { left: 8px; top: 11px; background: #2563eb; }
    .neural .n2 { right: 8px; top: 11px; background: #7c3aed; animation-delay: 0.2s; }
    .neural .n3 { left: 25px; bottom: 6px; background: #06b6d4; animation-delay: 0.4s; }
    .neural .n4 { left: 25px; top: 25px; background: #4f46e5; animation-delay: 0.6s; }

    /* 4. Scan field */
    .scan {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 14px;
      border: 1px solid #bfdbfe;
      background:
        radial-gradient(circle at 14px 14px, #dbeafe 1.5px, transparent 2px),
        radial-gradient(circle at 44px 14px, #dbeafe 1.5px, transparent 2px),
        radial-gradient(circle at 14px 44px, #dbeafe 1.5px, transparent 2px),
        radial-gradient(circle at 44px 44px, #dbeafe 1.5px, transparent 2px),
        linear-gradient(180deg, #ffffff, #f8fbff);
      overflow: hidden;
      box-shadow: inset 0 0 12px rgba(37, 99, 235, 0.05);
    }
    .scan::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 16px;
      background: linear-gradient(180deg, transparent, rgba(37, 99, 235, 0.35), transparent);
      animation: scanY 1.5s ease-in-out infinite;
    }

    /* 5. Shimmer capsule */
    .capsule {
      position: relative;
      width: 72px;
      height: 22px;
      border-radius: 999px;
      background: #dbeafe;
      overflow: hidden;
    }
    .capsule::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 26px;
      background: linear-gradient(90deg, transparent, rgba(37, 99, 235, 0.55), transparent);
      animation: shimmer 1.1s ease-in-out infinite;
    }

    /* 6. Thinking ring */
    .thinking-ring {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #2563eb, #7c3aed, #06b6d4, #2563eb);
      animation: spin 1.1s linear infinite;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.15);
    }
    .thinking-ring::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: #ffffff;
    }
    .thinking-ring::after {
      content: "";
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      background: radial-gradient(circle, #93c5fd, #2563eb);
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.28);
      animation: drift 1.2s ease-in-out infinite;
    }

    /* 7. Pulse emit */
    .emit {
      position: relative;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2563eb;
      box-shadow: 0 0 14px rgba(37, 99, 235, 0.35);
    }
    .emit::before,
    .emit::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(37, 99, 235, 0.35);
      animation: ringPulse 1.8s ease-out infinite;
    }
    .emit::after { animation-delay: 0.6s; }

    /* 8. Dot matrix */
    .matrix {
      display: grid;
      grid-template-columns: repeat(3, 8px);
      gap: 6px;
    }
    .matrix span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(180deg, #2563eb, #7c3aed);
      animation: blink 1.1s ease-in-out infinite;
    }
    .matrix span:nth-child(2) { animation-delay: 0.08s; }
    .matrix span:nth-child(3) { animation-delay: 0.16s; }
    .matrix span:nth-child(4) { animation-delay: 0.24s; }
    .matrix span:nth-child(5) { animation-delay: 0.32s; }
    .matrix span:nth-child(6) { animation-delay: 0.40s; }
    .matrix span:nth-child(7) { animation-delay: 0.48s; }
    .matrix span:nth-child(8) { animation-delay: 0.56s; }
    .matrix span:nth-child(9) { animation-delay: 0.64s; }

    /* 9. Token dots */
    .token-dots {
      display: flex;
      gap: 6px;
    }
    .token-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2563eb;
      animation: floatX 1.2s ease-in-out infinite;
    }
    .token-dots span:nth-child(2) {
      background: #4f46e5;
      animation-delay: 0.15s;
    }
    .token-dots span:nth-child(3) {
      background: #7c3aed;
      animation-delay: 0.3s;
    }
    .token-dots span:nth-child(4) {
      background: #06b6d4;
      animation-delay: 0.45s;
    }

    /* 10. AI spark field */
    .spark-field {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .spark-field i {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #2563eb;
      animation: blink 1.2s ease-in-out infinite;
      box-shadow: 0 0 10px rgba(37, 99, 235, 0.22);
    }
    .spark-field i:nth-child(1) { left: 6px; top: 24px; }
    .spark-field i:nth-child(2) { left: 18px; top: 10px; animation-delay: 0.15s; }
    .spark-field i:nth-child(3) { left: 28px; top: 24px; animation-delay: 0.3s; }
    .spark-field i:nth-child(4) { left: 40px; top: 10px; animation-delay: 0.45s; }
    .spark-field i:nth-child(5) { left: 18px; top: 38px; animation-delay: 0.6s; }
    .spark-field i:nth-child(6) { left: 40px; top: 38px; animation-delay: 0.75s; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="card"><div class="core-orbit" aria-label="loading"></div></div>

    <div class="card">
      <div class="token-stream" aria-label="loading">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="card">
      <div class="neural" aria-label="loading">
        <div class="line l1"></div>
        <div class="line l2"></div>
        <div class="line l3"></div>
        <div class="node n1"></div>
        <div class="node n2"></div>
        <div class="node n3"></div>
        <div class="node n4"></div>
      </div>
    </div>

    <div class="card"><div class="scan" aria-label="loading"></div></div>

    <div class="card"><div class="capsule" aria-label="loading"></div></div>

    <div class="card"><div class="thinking-ring" aria-label="loading"></div></div>

    <div class="card"><div class="emit" aria-label="loading"></div></div>

    <div class="card">
      <div class="matrix" aria-label="loading">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="card">
      <div class="token-dots" aria-label="loading">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="card">
      <div class="spark-field" aria-label="loading">
        <i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
    </div>
  </div>
</body>
</html>
