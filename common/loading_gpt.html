<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YES24 AI Thinking Loader</title>
<style>
  :root {
    --yes24-blue: #1967d2;
    --yes24-blue-2: #0b84ff;
    --yes24-red: #ff4b55;
    --ai-loader-size: 72px;
    --ai-character-size: 38px;
    --ai-text-size: 12px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #f7f9fc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  }

  .loader-showcase {
    display: flex;
    gap: 48px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* 실제 페이지에 넣을 때는 .yes24-ai-loader 블록만 복사해서 사용하면 됩니다. */
  .yes24-ai-loader {
    width: var(--ai-loader-size);
    min-height: calc(var(--ai-loader-size) + 28px);
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    color: #26364d;
    line-height: 1;
  }

  .yes24-ai-loader__mark {
    position: relative;
    width: var(--ai-loader-size);
    height: var(--ai-loader-size);
    display: grid;
    place-items: center;
  }

  /* --- Option 1 (기본) --- */
  .yes24-ai-loader--default .yes24-ai-loader__mark::before {
    content: "";
    position: absolute;
    inset: 7px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(25, 103, 210, .13) 0%, rgba(25, 103, 210, .06) 45%, rgba(25, 103, 210, 0) 72%);
    animation: yes24-loader-pulse 1.6s ease-in-out infinite;
  }

  .yes24-ai-loader--default .yes24-ai-loader__mark::after {
    content: "";
    position: absolute;
    inset: 10px;
    border-radius: 999px;
    border: 1px solid rgba(25, 103, 210, .18);
    border-top-color: rgba(25, 103, 210, .7);
    border-right-color: rgba(255, 75, 85, .65);
    animation: yes24-loader-spin 1.2s linear infinite;
  }

  .yes24-ai-loader__character {
    position: relative;
    z-index: 1;
    width: var(--ai-character-size);
    height: var(--ai-character-size);
    display: block;
    animation: yes24-loader-float 1.4s ease-in-out infinite;
    filter: drop-shadow(0 5px 8px rgba(25, 103, 210, .16));
  }

  .yes24-ai-loader__dots {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 6px;
  }

  .yes24-ai-loader__dots i {
    width: 4px;
    height: 4px;
    border-radius: 999px;
    background: var(--yes24-blue-2);
    opacity: .32;
    animation: yes24-loader-dot 1.05s ease-in-out infinite;
  }

  .yes24-ai-loader__dots i:nth-child(2) { animation-delay: .14s; }
  .yes24-ai-loader__dots i:nth-child(3) { animation-delay: .28s; background: var(--yes24-red); }

  .yes24-ai-loader__text {
    margin: 0;
    font-size: var(--ai-text-size);
    font-weight: 600;
    letter-spacing: -.02em;
    white-space: nowrap;
  }

  .yes24-ai-loader__text strong {
    color: var(--yes24-blue);
    font-weight: 700;
  }

  @keyframes yes24-loader-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes yes24-loader-pulse {
    0%, 100% { transform: scale(.9); opacity: .65; }
    50% { transform: scale(1.08); opacity: 1; }
  }

  @keyframes yes24-loader-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  @keyframes yes24-loader-dot {
    0%, 80%, 100% { transform: translateY(0); opacity: .3; }
    40% { transform: translateY(-3px); opacity: 1; }
  }

  @keyframes yes24-loader-spin-reverse {
    to { transform: rotate(-360deg); }
  }

  @keyframes yes24-loader-scan {
    0% { left: -45%; }
    100% { left: 100%; }
  }

  /* --- Option 2: 링 + 빨간 도트 --- */
  .yes24-ai-loader--option2 .yes24-ai-loader__mark::before {
    content: "";
    position: absolute;
    inset: 9px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(25, 103, 210, .12), rgba(25, 103, 210, 0) 70%);
    animation: yes24-loader-pulse 1.7s ease-in-out infinite;
  }

  .yes24-ai-loader--option2 .yes24-ai-loader__ring {
    position: absolute;
    inset: 10px;
    border-radius: 999px;
    border: 1px solid rgba(25, 103, 210, .18);
    border-top-color: rgba(25, 103, 210, .72);
    border-right-color: rgba(255, 75, 85, .62);
    animation: yes24-loader-spin 1.25s linear infinite;
  }

  .yes24-ai-loader--option2 .yes24-ai-loader__ring::after {
    content: "";
    position: absolute;
    right: 3px;
    top: 6px;
    width: 5px;
    height: 5px;
    border-radius: 999px;
    background: var(--yes24-red);
    box-shadow: 0 0 0 3px rgba(255, 75, 85, .10);
  }

  /* --- Option 3: 점선 궤도 + 스캔 바 --- */
  .yes24-ai-loader--option3 .yes24-ai-loader__mark::before {
    content: "";
    position: absolute;
    inset: 8px;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(25, 103, 210, .12), rgba(25, 103, 210, 0) 70%);
    animation: yes24-loader-pulse 1.8s ease-in-out infinite;
  }

  .yes24-ai-loader--option3 .yes24-ai-loader__orbit {
    position: absolute;
    inset: 9px;
    border-radius: 999px;
    border: 1px dashed rgba(25, 103, 210, .32);
    animation: yes24-loader-spin-reverse 2.8s linear infinite;
  }

  .yes24-ai-loader--option3 .yes24-ai-loader__bar {
    position: relative;
    width: 34px;
    height: 4px;
    border-radius: 999px;
    background: rgba(25, 103, 210, .12);
    overflow: hidden;
  }

  .yes24-ai-loader--option3 .yes24-ai-loader__bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -45%;
    width: 45%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--yes24-blue), var(--yes24-blue-2), var(--yes24-red));
    animation: yes24-loader-scan 1.15s ease-in-out infinite;
  }


</style>
</head>

    if (srcImg) {
      document.querySelectorAll('.yes24-ai-loader__character--clone').forEach(function(img) {
        img.src = srcImg.src;
      });
