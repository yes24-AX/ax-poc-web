<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검색 — AX Datahub (준비 중)</title>
<link rel="icon" href="https://image.yes24.com/sysimage/renew/gnb/favicon_n.ico" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" />
<style>
/* v8 서재 포털의 목적지 플레이스홀더 — 실제 사이트 오픈 시 SITES[].url만 교체하면 되는 임시 페이지 (차콜+골드 톤) */
:root { --bg:#131110; --page:#1d1916; --ink:#efe9df; --dim:rgba(239,233,223,.55); --line:rgba(212,169,92,.2); --gold:#d4a95c; }
* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  background:
    radial-gradient(ellipse 70% 46% at 50% -6%, rgba(212,169,92,.12), transparent 60%),
    radial-gradient(ellipse 120% 80% at 50% 116%, #201c18 0%, var(--bg) 55%);
  color:var(--ink); font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
}
.card { width:min(720px,100%); background:var(--page); border:1px solid rgba(212,169,92,.3); border-radius:12px; box-shadow:0 0 0 1px rgba(212,169,92,.1), 0 40px 100px rgba(0,0,0,.7); overflow:hidden; }
.chrome { display:flex; align-items:center; gap:12px; padding:12px 16px; background:linear-gradient(180deg,#221e1a,#1a1613); border-bottom:1px solid var(--line); }
.chrome .dots { display:flex; gap:6px; }
.chrome .dots i { width:10px; height:10px; border-radius:50%; background:#3a332c; }
.chrome .url { flex:1; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:6px 14px; font-size:12px; font-weight:600; color:var(--dim); }
.bodyw { padding:44px 40px 40px; text-align:center; }
.kicker { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.34em; color:var(--gold); border:1px solid rgba(212,169,92,.45); padding:6px 16px; }
h1 { margin-top:22px; font-size:34px; font-weight:900; letter-spacing:-.02em; }
.badge { display:inline-block; margin-top:14px; font-size:11px; font-weight:800; letter-spacing:.28em; color:var(--gold); background:rgba(19,17,16,.9); border:1px solid var(--gold); border-radius:999px; padding:8px 20px; }
p.desc { margin-top:14px; font-size:14.5px; line-height:1.8; color:var(--dim); }
.sk { margin-top:30px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.sk i { display:block; height:64px; border-radius:6px; background:rgba(239,233,223,.06); }
.sk i:first-child { grid-column:1/-1; height:38px; }
a.back { display:inline-block; margin-top:32px; font-size:13.5px; font-weight:800; color:var(--ink); text-decoration:none; border-bottom:2px solid var(--gold); padding-bottom:2px; }
a.back:hover { color:var(--gold); }
</style>
</head>
<body>
<div class="card">
  <div class="chrome"><span class="dots"><i></i><i></i><i></i></span><span class="url">datahub.yes24.com/search</span></div>
  <div class="bodyw">
    <span class="kicker">AX DATAHUB</span>
    <h1>검색</h1>
    <span class="badge">준비 중 · 곧 공개</span>
    <p class="desc">검색어·트렌드 분석<br />이 화면은 현재 개발 중입니다. 오픈 후 실제 화면으로 연결됩니다.</p>
    <div class="sk" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <a class="back" href="../index.html">← 서재로 돌아가기</a>
  </div>
</div>
</body>
</html>
