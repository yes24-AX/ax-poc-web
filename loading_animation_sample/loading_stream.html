<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>YES24 AI Loader - 3안: 지식의 바다</title>
<style>
  :root {
    --yes24-blue: #1967d2;
    --yes24-blue-2: #0b84ff;
    --yes24-red: #ff4b55;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .card {
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card-title {
    margin: 0;
    font-size: 14px;
    color: #666;
    font-weight: 500;
  }

  .text {
    margin: 0; font-size: 13px; font-weight: 600; color: #26364d; display: flex; align-items: center; gap: 4px;
  }
  .text strong { color: var(--yes24-blue); }
  .dots i {
    display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: #aab4c2; opacity: 0.4;
    animation: common-dot 1.2s infinite; margin: 0 1px;
  }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }

  @keyframes common-dot { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-3px); opacity: 1; } }

  .loader-stream { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .loader-stream .stage { position: relative; width: 90px; height: 90px; display: grid; place-items: center; overflow: hidden; border-radius: 50%; }
  .loader-stream .character { position: relative; z-index: 2; width: 44px; height: auto; animation: stream-swim 2.5s ease-in-out infinite; }
  .loader-stream .stream { position: absolute; inset: 0; z-index: 1; }
  .loader-stream .stream i { position: absolute; background: var(--yes24-blue-2); border-radius: 2px; opacity: 0; animation: stream-flow 2s linear infinite; }
  .loader-stream .stream i:nth-child(1) { width: 12px; height: 4px; top: 25%; left: 10%; transform: rotate(-15deg); animation-delay: 0s; --dx: 30px; --dy: 10px; }
  .loader-stream .stream i:nth-child(2) { width: 6px; height: 6px; top: 65%; right: 10%; background: var(--yes24-red); transform: rotate(15deg); animation-delay: 0.4s; --dx: -25px; --dy: -15px; }
  .loader-stream .stream i:nth-child(3) { width: 8px; height: 10px; bottom: 20%; left: 20%; transform: rotate(5deg); animation-delay: 0.8s; --dx: 20px; --dy: -25px; }
  .loader-stream .stream i:nth-child(4) { width: 14px; height: 3px; top: 35%; right: 25%; animation-delay: 1.2s; --dx: -35px; --dy: 5px; opacity: 0.3; }

  @keyframes stream-swim {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(3px, -4px) rotate(4deg); }
    50% { transform: translate(0, -6px) rotate(0deg); }
    75% { transform: translate(-3px, -4px) rotate(-4deg); }
  }
  @keyframes stream-flow {
    0% { transform: translate(0, 0) scale(1); opacity: 0; }
    20% { opacity: 0.6; }
    80% { opacity: 0.6; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.5); opacity: 0; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="loader-stream">
      <div class="stage">
        <div class="stream"><i></i><i></i><i></i><i></i></div>
        <img src="ico_ai02.svg" class="character" alt="YES24 AI">
      </div>
    </div>
  </div>

</body>
</html>
