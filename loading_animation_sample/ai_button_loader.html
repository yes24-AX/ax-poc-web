<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>버튼 로딩 애니메이션 v3</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: transparent;
  }

  .dot-orbit-loader {
    position: relative;
    width: 14px;
    height: 14px;
    display: block;
    animation: dot-orbit-spin 1s linear infinite;
  }

  .dot-orbit-loader::before,
  .dot-orbit-loader::after,
  .dot-orbit-loader span {
    content: "";
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 999px;
    background: #1967d2;
    box-shadow: 0 0 5px rgba(25, 103, 210, .35);
  }

  .dot-orbit-loader::before {
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    opacity: 1;
  }

  .dot-orbit-loader span {
    right: 1px;
    bottom: 1px;
    background: #0b84ff;
    opacity: .72;
  }

  .dot-orbit-loader::after {
    left: 1px;
    bottom: 1px;
    background: #7dd3fc;
    opacity: .48;
  }

  @keyframes dot-orbit-spin {
    to {
      transform: rotate(360deg);
    }
  }
</style>
</head>
<body>
  <span class="dot-orbit-loader" role="status" aria-label="로딩 중">
    <span aria-hidden="true"></span>
  </span>
</body>
</html>
