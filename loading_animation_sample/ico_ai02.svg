<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="50" height="50" viewBox="0 0 50 50">
	<style>
		@keyframes eye-move-blink {
			/* 전체 시간 7초 기준 */
			
			/* --- 1. 눈동자 움직임 (0 ~ 3.0초 유지) --- */
			/* 계산: (절대시간 / 7초) * 100 */
			0% { transform: translate(0, 0) scaleY(1); }
			7.14% { transform: translate(0, -2.5px) scaleY(1); }  /* 0.5초 */
			14.28% { transform: translate(0, 2.5px) scaleY(1); }  /* 1.0초 */
			21.42% { transform: translate(0, 0) scaleY(1); }      /* 1.5초 */
			28.57% { transform: translate(-2.5px, 0) scaleY(1); } /* 2.0초 */
			35.71% { transform: translate(2.5px, 0) scaleY(1); }  /* 2.5초 */
			42.85% { transform: translate(0, 0) scaleY(1); }      /* 3.0초 (움직임 끝) */

			/* --- 2. 깜빡임 (3.0 ~ 3.3초 유지) --- */
			45% { transform: translate(0, 0) scaleY(0.1); }       /* 3.15초 (눈 감음) */
			47.14% { transform: translate(0, 0) scaleY(1); }      /* 3.30초 (눈 뜸) */

			/* --- 3. 대기 (3.3 ~ 7.0초) --- */
			100% { transform: translate(0, 0) scaleY(1); }        /* 나머지 시간 대기 */
		}

		.anim-eye {
			transform-box: fill-box;
			transform-origin: center;
			animation: eye-move-blink 7s infinite; /* 5s -> 7s로 변경 */
		}
	</style>
	<defs>
