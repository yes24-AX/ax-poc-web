<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AX Stay</title>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1f2a20;
    --accent: #2f5233;
    --card-bg: #ffffff;
    --border: #e2ddd0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  header {
    padding: 32px 24px 16px;
    text-align: center;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: 0.02em;
    color: var(--accent);
  }
  header p {
    margin: 0;
    color: #6b6355;
    font-size: 14px;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px 24px 64px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 24px rgba(31, 42, 32, 0.12);
  }
  .card img {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: #eee;
  }
  .card .label {
    padding: 10px 14px;
    font-size: 13px;
    color: #6b6355;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card .label strong {
    color: var(--ink);
    font-size: 14px;
  }
  .empty {
    text-align: center;
    color: #a19c8d;
    padding: 60px 16px;
    grid-column: 1 / -1;
  }

  /* lightbox */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 15, 0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .lightbox .close {
    position: absolute;
    top: 20px;
    right: 24px;
    color: #fff;
    font-size: 32px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.8;
  }
  .lightbox .close:hover { opacity: 1; }
  .lightbox .toggle {
    position: absolute;
    top: 24px;
    left: 24px;
    display: flex;
    gap: 8px;
  }
  .lightbox .toggle button {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
  }
  .lightbox .toggle button.active {
    background: var(--accent);
    border-color: var(--accent);
  }
</style>
</head>
<body>

<header>
  <h1>AX Stay</h1>
  <p>assets 폴더의 이미지를 자동으로 불러와 보여줍니다</p>
</header>

<main id="gallery"></main>

<div class="lightbox" id="lightbox">
  <span class="close" id="lightboxClose">&times;</span>
  <div class="toggle">
    <button id="btnH">가로</button>
    <button id="btnV">세로</button>
  </div>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
  // 연속으로 이 횟수만큼 이미지가 없으면 탐색을 중단합니다.
  const MAX_CONSECUTIVE_MISSES = 3;
  // 최대 탐색 번호 (안전장치)
  const MAX_ID = 200;

  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const btnH = document.getElementById('btnH');
  const btnV = document.getElementById('btnV');

  let currentId = null;

  function setOrientation(orientation) {
    lightboxImg.src = `assets/${currentId}-${orientation}.png`;
    btnH.classList.toggle('active', orientation === 'h');
    btnV.classList.toggle('active', orientation === 'v');
  }

  function openLightbox(id) {
    currentId = id;
    const preferVertical = window.matchMedia('(max-width: 700px)').matches;
    setOrientation(preferVertical ? 'v' : 'h');
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
  btnH.addEventListener('click', () => setOrientation('h'));
  btnV.addEventListener('click', () => setOrientation('v'));

  function imageExists(src) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => resolve(false);
      img.src = src;
    });
  }

  function renderCard(id) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <picture>
        <source srcset="assets/${id}-v.png" media="(max-width: 700px)">
        <img src="assets/${id}-h.png" alt="AX Stay 컨셉 ${id}">
      </picture>
      <div class="label">
        <strong>컨셉 ${id}</strong>
        <span>클릭하여 크게보기</span>
      </div>
    `;
    card.addEventListener('click', () => openLightbox(id));
    gallery.appendChild(card);
  }

  async function loadGallery() {
    gallery.innerHTML = '<div class="empty">불러오는 중...</div>';
    let found = 0;
    let misses = 0;
    let firstRender = true;

    for (let n = 1; n <= MAX_ID && misses < MAX_CONSECUTIVE_MISSES; n++) {
      const id = String(n).padStart(2, '0');
      const exists = await imageExists(`assets/${id}-h.png`);
      if (exists) {
        if (firstRender) {
          gallery.innerHTML = '';
          firstRender = false;
        }
        renderCard(id);
        found++;
        misses = 0;
      } else {
        misses++;
      }
    }

    if (found === 0) {
      gallery.innerHTML = '<div class="empty">assets 폴더에 이미지를 추가해주세요.<br>(예: 01-h.png, 01-v.png)</div>';
    }
  }

  loadGallery();
</script>

</body>
</html>
