<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 사이트 관제 — AX Labs</title>
  <link rel="icon" href="https://image.yes24.com/sysimage/renew/gnb/favicon_n.ico" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="app-layout">

  <!-- ===================== SIDEBAR ===================== -->
  <nav class="sidebar" aria-label="주 메뉴">
    <div class="sidebar-header">
      <a class="sidebar-header-link" href="#">
        <span class="sidebar-logo">AX</span>
        <span class="sidebar-brand">Labs</span>
      </a>
    </div>
    <div class="sidebar-content">
      <div class="sidebar-group">
        <span class="sidebar-group-label">운영 관제</span>
        <ul class="sidebar-menu">
          <li>
            <a class="nav-item-btn active" href="#">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              <span class="nav-item-text">AI 사이트 관제</span>
            </a>
          </li>
          <li>
            <a class="nav-item-btn" href="#">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
              <span class="nav-item-text">태그 모니터링</span>
            </a>
          </li>
          <li>
            <a class="nav-item-btn" href="#">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              <span class="nav-item-text">AX Datahub 오류 로그</span>
            </a>
          </li>
        </ul>
      </div>
      <div class="sidebar-group">
        <span class="sidebar-group-label">분석</span>
        <ul class="sidebar-menu">
          <li>
            <a class="nav-item-btn" href="#">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
              <span class="nav-item-text">매출 분석</span>
            </a>
          </li>
          <li>
            <a class="nav-item-btn" href="#">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 4 4 5-5"/></svg>
              <span class="nav-item-text">클릭스트림</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="user-btn">
        <span class="user-avatar">홍</span>
        <div>
          <div class="user-name">홍길동</div>
          <div class="user-dept">사이트 운영</div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ===================== MAIN ===================== -->
  <div class="main-wrapper">

    <header class="top-header">
      <button class="btn btn-icon btn-outline btn-sm" title="사이드바 토글" aria-label="사이드바 토글">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <div class="header-separator"></div>
      <div class="header-breadcrumb">
        <span class="header-breadcrumb-group">운영 관제</span>
        <span class="header-breadcrumb-sep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
        <span class="header-breadcrumb-current">AI 사이트 관제</span>
      </div>
      <div class="header-spacer"></div>
      <div class="header-actions">
        <label class="sm-switch" title="UI 구조 검토용 — 각 영역 이름을 점선으로 표시">
          <input type="checkbox" id="regionToggle" /> 영역 표시
        </label>
        <select class="sm-select" id="scenarioSelect" title="POC 시나리오 전환">
          <option value="normal">시나리오: 정상 수집</option>
          <option value="stale">시나리오: 수집 지연</option>
          <option value="empty">시나리오: 열린 사건 없음</option>
        </select>
        <span class="model-pill">POC · 목업 데이터</span>
        <button class="theme-toggle" id="themeToggle" title="다크/라이트 모드 전환" aria-label="다크모드 전환">
          <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg id="iconSun" class="hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </header>

    <main class="page-content">

      <div class="page-heading" data-region="A. 페이지 헤딩">
        <div class="page-heading-left">
          <div>
            <h1 class="page-title">AI 사이트 관제</h1>
            <p class="page-subtitle">규칙이 자동 탐지한 사건과 AI 해석을 확인하고, 필요한 원본 로그(Kibana·Jennifer)로 이동하는 사건함입니다.</p>
          </div>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-outline btn-sm" id="openGuide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
            판정 기준 · 사용 순서
          </button>
          <button class="btn btn-outline btn-sm" id="reloadBtn" title="관제 DB에 저장된 결과를 다시 조회합니다 (수집·AI 실행 아님)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            다시 조회
          </button>
        </div>
      </div>

      <!-- B. 수집 상태 -->
      <section id="statusStrip" class="sm-status-strip" data-region="B. 수집 상태"></section>

      <!-- C. 최근 구간 건수 -->
      <section id="kpis" class="sm-kpis" data-region="C. 최근 구간 건수"></section>

      <!-- D/E. 사건함 -->
      <section class="sm-inbox">
        <div class="card sm-list-card" data-region="D. 사건 목록">
          <div class="sm-list-head">
            <div class="card-title">사건함 <span class="sm-tip" title="열린 사건 우선 최대 100건 조회 · 분류 숫자는 조회 결과 기준">?</span></div>
            <div class="sm-seg" id="segTabs" role="tablist"></div>
            <div class="sm-list-tools">
              <select class="sm-select" id="siteFilter" aria-label="사이트 필터">
                <option value="">전체 사이트</option>
                <option>PC</option><option>MOBILE</option><option>EVENT</option><option>FRONT</option><option>DATAHUB</option>
              </select>
              <select class="sm-select" id="sortSelect" aria-label="정렬">
                <option value="sev">심각도순</option>
                <option value="recent">최근 평가순</option>
              </select>
              <span class="sm-count" id="listCount"></span>
            </div>
          </div>
          <ul class="sm-list" id="incidentList"></ul>
        </div>

        <div class="card sm-detail" id="detail" data-region="E. 사건 상세"></div>
      </section>

    </main>
  </div>
</div>

<!-- 판정 기준 드로어 -->
<div class="sm-drawer-backdrop hidden" id="guideBackdrop"></div>
<aside class="sm-drawer hidden" id="guideDrawer" aria-label="판정 기준" data-region="F. 판정 기준 드로어"></aside>

<script src="assets/js/mock-data.js"></script>
<script src="assets/js/detail.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
